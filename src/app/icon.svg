<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseGold" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#EAA682"/>
      <stop offset="50%" stop-color="#C77174"/>
      <stop offset="100%" stop-color="#A5495B"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge matching user photo -->
  <circle cx="256" cy="256" r="236" fill="url(#roseGold)"/>

  <!-- Main 4-pointed Sparkle Star with smooth curvature -->
