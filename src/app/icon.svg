    d="M 256 124
       C 256 198 286 228 360 228
       C 286 228 256 258 256 332
       C 256 258 226 228 152 228
       C 226 228 256 198 256 124 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small Dot at Lower-Left -->
  <circle cx="196" cy="308" r="18" fill="#FFFFFF"/>

  <!-- Small Plus Sparkle at Upper-Right -->
  <path
    d="M 362 146 L 362 182 M 344 164 L 380 164"
    stroke="#FFFFFF"
